name: Test and build Android APK

on:
  push:
    branches: [codex/mobile-api-apk]
  workflow_dispatch:
    inputs:
      api_base_url:
        description: 'Backend URL (localhost uses adb reverse over USB)'
        required: true
        default: 'http://localhost:8000'
      execution_mode:
        description: 'Match BACKEND_EXECUTION_MODE on the server'
        type: choice
        options: [background, synchronous]
        default: background

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests

  apk:
    needs: backend-tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile
    env:
      API_BASE_URL: ${{ inputs.api_base_url || 'http://localhost:8000' }}
      API_EXECUTION_MODE: ${{ inputs.execution_mode || 'background' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub --reporter expanded
      - name: Build installable arm64 test APK
        run: >-
          flutter build apk --debug --target-platform android-arm64
          --dart-define="API_BASE_URL=$API_BASE_URL"
          --dart-define="API_EXECUTION_MODE=$API_EXECUTION_MODE"
      - name: Checksum
        run: sha256sum build/app/outputs/flutter-apk/app-debug.apk > build/app/outputs/flutter-apk/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: slip-automation-arm64-test-apk
          path: |
            mobile/build/app/outputs/flutter-apk/app-debug.apk
            mobile/build/app/outputs/flutter-apk/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
