APP_ENV: "production"
DEBUG_MODE: "false"
TEMP_DIR: "/tmp/slip-automation"
TEMP_FILE_MAX_AGE_HOURS: "1"
MAX_UPLOAD_MB: "12"
LOG_LEVEL: "INFO"
DOCUMENT_AI_PROVIDER: "gemini"
DOCUMENT_AI_MODEL: "gemini-3.5-flash-lite"
GEMINI_BASE_URL: "https://generativelanguage.googleapis.com/v1beta/openai/"
GEMINI_TIMEOUT_SECONDS: "60"
GEMINI_CREDENTIAL_FOCUS_TIMEOUT_SECONDS: "12"
GEMINI_REASONING_EFFORT: "low"
BROWSER_HEADLESS: "true"
BROWSER_TIMEOUT_SECONDS: "30"
BROWSER_NAVIGATION_TIMEOUT_SECONDS: "45"
BROWSER_MAX_SEARCH_RESULTS: "8"
AGENT_MAX_STEPS: "40"
AGENT_MAX_NAVIGATIONS: "24"
AGENT_MAX_FORM_SUBMISSIONS: "2"
AGENT_MAX_WAIT_SECONDS: "8"
MAX_REPORT_DOWNLOAD_MB: "25"
INTERACTION_AI_PROVIDER: "deterministic"
INTERACTION_AI_MODEL: ""
PORTAL_URL_OVERRIDES_JSON: '{"rmi.edu.pk":"http://rmi.olivecliq.org/olivecliqgh/index.php/site/login","nwgh.pk":"http://reports.nwgh.pk:8086/Forms/InvestigatonOnline.aspx","www.nwgh.pk":"http://reports.nwgh.pk:8086/Forms/InvestigatonOnline.aspx"}'
PORTAL_HTTPS_HOST_REWRITES_JSON: "{}"
ALLOW_INSECURE_REPORT_PORTALS: "false"
INSECURE_REPORT_PORTAL_HOSTS: "rmi.olivecliq.org,reports.nwgh.pk"
BACKEND_EXECUTION_MODE: "synchronous"
BACKEND_MAX_CONCURRENT_JOBS: "1"
JOB_TTL_MINUTES: "30"
API_ALLOWED_ORIGINS: ""
